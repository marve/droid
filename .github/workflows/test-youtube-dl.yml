name: Test youtube-dl service

on:
  push:
    paths:
      - 'services/youtube-dl/**'
  pull_request:
    paths:
      - 'services/youtube-dl/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run tests
        run: bats services/youtube-dl/tests/start.bats
